[package]
name = "filament-analyze"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "SMT-backed consistency and implication analysis for versioned requirement contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/filament-analyze"

[lib]
name = "filament_analyze"
path = "src/lib.rs"

[workspace]
members = [".", "crates/method-contract"]
resolver = "2"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[dependencies]
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
jsonschema = { version = "=0.17.1", default-features = false }
libc = "=0.2.189"
filament-contract-model = { git = "https://github.com/agent-ix/filament-contract-ir", branch = "main", version = "=0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
filament-analyze-method-contract = { path = "crates/method-contract", version = "=0.1.0" }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
proptest = "~1.8.0"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }

[profile.release]
lto = "thin"
codegen-units = 1
